# Ashita rebuild. Run it by hand (Actions > Ashita rebuild > Run workflow) when Ashita publishes a new release, and
# enter the commit ID of that Ashita release. If its plugin interface differs from the latest release of this plugin,
# it rebuilds that release's source against the new SDK and saves a DRAFT release tagged
# vX.Y_Interface-N.NN with the zip, SHA-256 sums and a build attestation. The original release stays as it is.
# Test the draft's zip in game, then publish it (as the latest release). If nothing changed it does nothing; if the
# build fails it opens an issue instead.
name: Ashita rebuild
run-name: Ashita rebuild for ${{ inputs.ashita_commit }}

on:
  workflow_dispatch:
    inputs:
      ashita_commit:
        description: Full commit ID (40 characters) of the Ashita release, from AshitaXI/Ashita-v4beta
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      base: ${{ steps.plan.outputs.base }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      from: ${{ steps.plan.outputs.from }}
      interface: ${{ steps.plan.outputs.interface }}
      sdk-ref: ${{ steps.plan.outputs.sdk-ref }}
    steps:
      - name: Get the release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /.github/scripts/
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Compare Ashita's interface with the latest release
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASHITA_COMMIT: ${{ inputs.ashita_commit }}
        run: |
          . ./.github/scripts/release-tools.ps1
          Get-RebuildPlan -Repo $env:GITHUB_REPOSITORY -AshitaCommit $env:ASHITA_COMMIT.Trim() | ForEach-Object { Add-Content $env:GITHUB_OUTPUT $_ }

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.package.outputs.commit }}
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: release
          persist-credentials: false

      - name: Get the current release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          sparse-checkout: |
            /.github/scripts/
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the new Ashita SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AshitaXI/Ashita-v4beta
          ref: ${{ needs.plan.outputs.sdk-ref }}
          path: ashita
          sparse-checkout: |
            /plugins/sdk/
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Check release README conversion
        shell: pwsh
        run: ./tools/.github/scripts/test-release-readme.ps1 -Root ./release

      - name: Build and package with readable README
        id: package
        shell: pwsh
        working-directory: release
        env:
          INTERFACE: ${{ needs.plan.outputs.interface }}
          SDK_REF: ${{ needs.plan.outputs.sdk-ref }}
          BASE: ${{ needs.plan.outputs.base }}
          OUT: ${{ runner.temp }}/release-files
        run: |
          # The release's own settings and build script, with the current release tools.
          . ../tools/.github/scripts/release-tools.ps1
          $cfg = Get-ReleaseConfig
          $version = Get-PluginVersion $cfg
          $dll = Invoke-PluginBuild $cfg -Sdk ../ashita/plugins/sdk -Interface $env:INTERFACE
          $info = Get-BuildInfo -Version $version -Interface $env:INTERFACE -SdkRef $env:SDK_REF
          $zip = New-ReleasePackage $cfg -Dll $dll -Version $version -Interface $env:INTERFACE -BuildInfo $info -OutDir $env:OUT
          $changes = Get-ChangelogLink $cfg -Version $version -Tag $env:BASE
          Get-DownloadNotes $cfg -ZipName $zip -Interface $env:INTERFACE -SdkRef $env:SDK_REF -OutDir $env:OUT -Changelog $changes | Set-Content (Join-Path $env:OUT 'downloads.md')
          Add-Content $env:GITHUB_OUTPUT "zip=$zip"
          Add-Content $env:GITHUB_OUTPUT "commit=$($info.sourceCommit)"
          Write-Summary "Built $zip from $($info.sourceCommit) with Ashita SDK $env:SDK_REF."

      - name: Keep the files for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Get the release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /.github/scripts/
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Get the built files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files

      - name: Attest the zip
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-files/*.zip

      - name: Save the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          FROM: ${{ needs.plan.outputs.from }}
          INTERFACE: ${{ needs.plan.outputs.interface }}
          COMMIT: ${{ needs.build.outputs.commit }}
          ZIP: ${{ needs.build.outputs.zip }}
          FILES: ${{ runner.temp }}/release-files
          RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag
        run: |
          . ./.github/scripts/release-tools.ps1
          if (Invoke-Gh @('release', 'view', $env:TAG, '--repo', $env:GITHUB_REPOSITORY, '--json', 'tagName') -AllowNotFound) {
            throw "$env:TAG appeared while this run was building; check the releases before running it again."
          }
          $intro = @(
            "Rebuild of [$env:BASE]($env:RELEASES_URL/$env:BASE) for Interface **$env:INTERFACE**. The plugin's code is unchanged.",
            '',
            "For Interface $env:FROM, use [$env:PREVIOUS]($env:RELEASES_URL/$env:PREVIOUS)."
          ) -join "`n"
          $notes = Join-ReleaseNotes -Body $intro -Downloads ((Get-Content (Join-Path $env:FILES 'downloads.md')) -join "`n")
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes
          $files = @((Join-Path $env:FILES $env:ZIP), (Join-Path $env:FILES 'SHA256SUMS.txt'))
          # Titled like the owner's releases: "<Name> v1.3 - Interface 4.40".
          $title = "$(($env:GITHUB_REPOSITORY -split '/')[1]) $env:BASE - Interface $env:INTERFACE"
          Invoke-Gh (@('release', 'create', $env:TAG, '--repo', $env:GITHUB_REPOSITORY, '--draft', '--target', $env:COMMIT, '--title', $title, '--notes-file', $notesFile) + $files) | Out-Null
          Write-Summary "Draft $env:TAG saved with $env:ZIP. Test it in game, then publish it as the latest release."

  report:
    needs: [plan, build, publish]
    if: failure() && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
          INTERFACE: ${{ needs.plan.outputs.interface }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $title = "Ashita interface ${env:INTERFACE}: rebuild of $env:BASE failed"
          $open = gh issue list --repo $env:GITHUB_REPOSITORY --state open --search "in:title $env:INTERFACE rebuild" --json title --jq '.[].title'
          if ($LASTEXITCODE) { throw 'Could not search the existing issues.' }
          if (@($open) -contains $title) { Write-Host 'An issue for this is already open.'; exit 0 }
          $body = "The Ashita rebuild of $env:BASE for interface $env:INTERFACE failed. The run shows which step (checkout, build, packaging or publishing) and whether a draft was left behind.`n`n$env:RUN_URL"
          gh issue create --repo $env:GITHUB_REPOSITORY --title $title --body $body
          if ($LASTEXITCODE) { throw 'Could not open the issue.' }
